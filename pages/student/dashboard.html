<!DOCTYPE html>
<html lang="en" translate="no" class="no-js" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Overview | Soft Skill Zone Student</title>
<meta name="robots" content="noindex">
<script>
(function(){var t=null;try{t=localStorage.getItem("ssz.theme");}catch(e){}
if(t!=="light"&&t!=="dark"){t=window.matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";}
document.documentElement.setAttribute("data-theme",t);
document.documentElement.style.colorScheme=t;})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../../css/tokens.css">
<link rel="stylesheet" href="../../css/base.css">
<link rel="stylesheet" href="../../css/layout.css">
<link rel="stylesheet" href="../../css/components.css">
<link rel="stylesheet" href="../../css/animations.css">
<link rel="stylesheet" href="../../css/pages.css">
<link rel="stylesheet" href="../../css/auth.css">
<link rel="stylesheet" href="../../css/dashboard.css">
<link rel="manifest" href="../../manifest.json">
<link rel="icon" href="../../images/logo/favicon.svg" type="image/svg+xml">
<link rel="icon" href="../../images/logo/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="../../images/logo/apple-touch-icon.png">
</head>

<body data-depth="2">

<div class="dash" id="dash">
  <aside class="dash-side" id="dashSide"></aside>
  <div class="dash-main">
    <header class="dash-top" id="dashTop"></header>
    <main class="dash-body" id="dashBody">

      <!-- Sabse pehla hissa: "abhi kya karna hai". Pehle yahan seedhe chaar
           tile the (Attendance, Fees, Assignments, Notifications) — chaaron
           barabar bade, chaaron ek jaise. Phone par asli kaam — jaise abhi
           chal rahi live class ka link — un tiles ke neeche chala jaata tha
           aur student ko scroll karna padta tha.

           Ab sabse upar sirf EK cheez hai: jo is waqt sabse zaroori hai.
           Kram js/dashboard/student-home.js ke todayCard() me likha hai. -->
      <div id="homeToday" style="margin-bottom:1.5rem"></div>

      <div id="homeStats" class="auto-grid" style="grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));margin-bottom:2rem"></div>
      <div class="split" style="align-items:start;grid-template-columns:1fr">
        <div class="stack" style="gap:2rem">
          <section class="dash-section" id="homeNextClass"></section>
          <section class="dash-section">
            <div class="dash-section__head"><h2>Recent Assignments</h2><a class="btn-ssz btn-ghost-ssz btn-sm-ssz" href="assignments.html">Sab dekhein</a></div>
            <div id="homeAssignments"></div>
          </section>
        </div>
        <div class="stack" style="gap:2rem">
          <section class="dash-section" id="homeCourseCard"></section>
          <section class="dash-section">
            <div class="dash-section__head"><h2>Notifications</h2><a class="btn-ssz btn-ghost-ssz btn-sm-ssz" href="notifications.html">Sab dekhein</a></div>
            <div id="homeNotify" class="stack" style="gap:.75rem"></div>
          </section>
        </div>
      </div>

    </main>
  </div>
</div>

<script type="module" src="../../js/dashboard/student-home.js"></script>
</body>
</html>
