<body data-depth="1">
<a class="skip-link" href="#main">Skip to content</a>
<div data-include="navbar"></div>

<main id="main">
  <section class="page-hero">
    <div class="ssz-container">
      <span class="eyebrow">Contact</span>
      <h1 style="margin:.6rem 0 .75rem">Humse <span class="text-gradient">baat karein</span></h1>
      <p style="max-width:62ch;margin-inline:auto">Course, fees ya batch timing — jo bhi poochhna ho, seedha poochhein.</p>
      <nav class="breadcrumb-ssz" aria-label="Breadcrumb"><a href="../index.html">Home</a><span>/</span><span aria-current="page">Contact</span></nav>
    </div>
  </section>

  <section class="section">
    <div class="ssz-container">
      <div class="contact-layout">

        <div class="stack" data-reveal="left" id="contactInfo"></div>

        <div class="card-ssz" data-reveal="right">
          <div class="card-ssz__head"><h2 style="margin:0;font-size:1.15rem">Enquiry bhejein</h2></div>
          <div class="card-ssz__body">
            <form id="contactForm" novalidate>
              <div class="field">
                <label class="field__label" for="cName">Aapka naam <span class="req">*</span></label>
                <input class="input-ssz" id="cName" name="name" type="text" placeholder="Poora naam" autocomplete="name">
                <div class="field__error"></div>
              </div>
              <div class="split" style="gap:1rem;grid-template-columns:1fr 1fr">
                <div class="field">
                  <label class="field__label" for="cMobile">Mobile <span class="req">*</span></label>
                  <input class="input-ssz" id="cMobile" name="mobile" type="tel" inputmode="numeric" placeholder="10 digit" autocomplete="tel">
                  <div class="field__error"></div>
                </div>
                <div class="field">
                  <label class="field__label" for="cEmail">Email</label>
                  <input class="input-ssz" id="cEmail" name="email" type="email" placeholder="optional" autocomplete="email">
                  <div class="field__error"></div>
                </div>
              </div>
              <div class="field">
                <label class="field__label" for="cSubject">Kis baare me? <span class="req">*</span></label>
                <select class="select-ssz" id="cSubject" name="subject">
                  <option value="">Chunein</option>
                  <option>Course &amp; fees</option>
                  <option>Admission process</option>
                  <option>Batch timing</option>
                  <option>Certificate / documents</option>
                  <option>Kuch aur</option>
                </select>
                <div class="field__error"></div>
              </div>
              <div class="field">
                <label class="field__label" for="cMessage">Message <span class="req">*</span></label>
                <textarea class="textarea-ssz" id="cMessage" name="message" placeholder="Apna sawal yahan likhein…"></textarea>
                <div class="field__error"></div>
              </div>
              <button class="btn-ssz btn-primary-ssz btn-block-ssz" type="submit" id="contactSubmit">Enquiry Bhejein</button>
              <p class="field__hint" style="margin-top:.75rem;text-align:center">
                Hum aam taur par 24 ghante ke andar reply karte hain.
              </p>
            </form>
          </div>
        </div>

      </div>

      <div style="margin-top:3rem" data-reveal="up">
        <div class="map-frame">
          <iframe id="contactMap" title="Institute location" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
        </div>
      </div>
    </div>
  </section>

</main>
