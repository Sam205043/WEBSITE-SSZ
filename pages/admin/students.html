<!DOCTYPE html>
<html lang="en" translate="no" class="no-js" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Students | SSZ Admin</title>
<meta name="robots" content="noindex">
<script>
(function(){var t=null;try{t=localStorage.getItem("ssz.theme");}catch(e){}
if(t!=="light"&&t!=="dark"){t=window.matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";}
document.documentElement.setAttribute("data-theme",t);
document.documentElement.style.colorScheme=t;})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../../css/tokens.css">
<link rel="stylesheet" href="../../css/base.css">
<link rel="stylesheet" href="../../css/layout.css">
<link rel="stylesheet" href="../../css/components.css">
<link rel="stylesheet" href="../../css/animations.css">
<link rel="stylesheet" href="../../css/pages.css">
<link rel="stylesheet" href="../../css/auth.css">
<link rel="stylesheet" href="../../css/dashboard.css">
<link rel="manifest" href="../../manifest.json">
<link rel="icon" href="../../images/logo/favicon.svg" type="image/svg+xml">
<link rel="icon" href="../../images/logo/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="../../images/logo/apple-touch-icon.png">
</head>

<body data-depth="2">

<div class="dash" id="dash">
  <aside class="dash-side" id="dashSide"></aside>
  <div class="dash-main">
    <header class="dash-top" id="dashTop"></header>
    <main class="dash-body" id="dashBody">

      <div class="toolbar">
        <div class="toolbar__search">
          <div class="input-group-ssz">
            <span class="input-group-ssz__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></span>
            <input class="input-ssz" id="stSearch" type="search" placeholder="Naam, ID ya mobile se dhundein…" aria-label="Student search">
          </div>
        </div>
        <select class="select-ssz" id="stCourse" aria-label="Course filter"></select>
        <select class="select-ssz" id="stStatus" aria-label="Status filter">
          <option value="all">Sab status</option>
          <option value="active">Active</option>
          <option value="completed">Completed</option>
          <option value="dropped">Dropped</option>
        </select>
        <button class="btn-ssz btn-secondary-ssz" type="button" id="stExport">Excel Export</button>
      </div>
      <p class="text-muted-c" id="stCount" style="font-size:.85rem;margin-bottom:1rem"></p>
      <div class="table-wrap">
        <table class="table-ssz">
          <thead><tr><th>Student</th><th>Course / Batch</th><th>Mobile</th><th class="num">Bakaya</th><th>Status</th><th><span class="sr-only">Actions</span></th></tr></thead>
          <tbody id="stRows"></tbody>
        </table>
      </div>

    </main>
  </div>
</div>

<script type="module" src="../../js/dashboard/admin-students.js"></script>
</body>
</html>
