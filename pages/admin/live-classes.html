<!DOCTYPE html>
<html lang="en" translate="no" class="no-js" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Live Classes | SSZ Admin</title>
<meta name="robots" content="noindex">
<script>
(function(){var t=null;try{t=localStorage.getItem("ssz.theme");}catch(e){}
if(t!=="light"&&t!=="dark"){t=window.matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";}
document.documentElement.setAttribute("data-theme",t);
document.documentElement.style.colorScheme=t;})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../../css/tokens.css">
<link rel="stylesheet" href="../../css/base.css">
<link rel="stylesheet" href="../../css/layout.css">
<link rel="stylesheet" href="../../css/components.css">
<link rel="stylesheet" href="../../css/animations.css">
<link rel="stylesheet" href="../../css/pages.css">
<link rel="stylesheet" href="../../css/auth.css">
<link rel="stylesheet" href="../../css/admission.css">
<link rel="stylesheet" href="../../css/dashboard.css">
<link rel="manifest" href="../../manifest.json">
<link rel="icon" href="../../images/logo/favicon.svg" type="image/svg+xml">
<link rel="icon" href="../../images/logo/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="../../images/logo/apple-touch-icon.png">
</head>

<body data-depth="2">

<div class="dash" id="dash">
  <aside class="dash-side" id="dashSide"></aside>
  <div class="dash-main">
    <header class="dash-top" id="dashTop"></header>
    <main class="dash-body" id="dashBody">

      <div class="toolbar">
        <select class="select-ssz" id="lcBatch" aria-label="Batch filter"><option value="all">Sab batches</option></select>
        <span style="flex:1"></span>
        <button class="btn-ssz btn-primary-ssz" type="button" id="lcNew">+ Class Schedule Karein</button>
      </div>
      <section class="dash-section" id="lcRecSection" hidden>
        <div class="dash-section__head">
          <h2>Recording daalna baaki hai</h2>
          <span class="text-muted-c" style="font-size:.8rem">Class ho chuki hai, recording nahi lagi</span>
        </div>
        <div id="lcRecPending" class="stack" style="gap:.85rem"></div>
      </section>
      <section class="dash-section">
        <div class="dash-section__head"><h2>Upcoming</h2></div>
        <div id="lcUpcoming" class="stack" style="gap:.85rem"></div>
      </section>
      <section class="dash-section">
        <div class="dash-section__head"><h2>Ho chuki</h2></div>
        <div id="lcPast" class="stack" style="gap:.85rem"></div>
      </section>

    </main>
  </div>
</div>

<script type="module" src="../../js/dashboard/admin-classes.js"></script>
</body>
</html>
