<body data-depth="2">

<main id="main">
  <section class="page-hero">
    <div class="ssz-container">
      <span class="eyebrow">Free Tool</span>
      <h1 style="margin:.6rem 0 .75rem">Resume <span class="text-gradient">Builder</span></h1>
      <p style="max-width:60ch;margin-inline:auto">Form bharein — professional resume turant taiyaar, print ya PDF save karein.</p>
      <nav class="breadcrumb-ssz" aria-label="Breadcrumb">
        <a href="../../index.html">Home</a><span>/</span>
        <a href="../tools.html">Free Tools</a><span>/</span>
        <span aria-current="page">Resume Builder</span>
      </nav>
    </div>
  </section>

  <section class="section">
    <div class="ssz-container">
      <div class="tool-layout tool-layout--wide" style="gap:2rem">
        <div class="tool-panel">
          <div class="tool-panel__head">Aapki Jaankari</div>
          <div class="tool-panel__body">
            <div class="adm-row">
              <div class="field">
                <label class="field__label">Poora naam</label>
                <input class="input-ssz" data-r="name" type="text" placeholder="Rahul Kumar">
              </div>
              <div class="field">
                <label class="field__label">Job title / objective heading</label>
                <input class="input-ssz" data-r="title" type="text" placeholder="Computer Operator">
              </div>
            </div>
            <div class="adm-row adm-row--3">
              <div class="field">
                <label class="field__label">Mobile</label>
                <input class="input-ssz" data-r="phone" type="tel" placeholder="98765 43210">
              </div>
              <div class="field">
                <label class="field__label">Email</label>
                <input class="input-ssz" data-r="email" type="email" placeholder="name@email.com">
              </div>
              <div class="field">
                <label class="field__label">Sheher</label>
                <input class="input-ssz" data-r="city" type="text" placeholder="Ara, Bihar">
              </div>
            </div>
            <div class="field">
              <label class="field__label">Objective / About</label>
              <textarea class="textarea-ssz" data-r="about" style="min-height:80px" placeholder="2-3 line me apne baare me likhein"></textarea>
            </div>
            <div class="field">
              <label class="field__label">Education (har line me ek)</label>
              <textarea class="textarea-ssz" data-r="education" style="min-height:90px" placeholder="B.Com — Veer Kunwar Singh University — 2025&#10;12th (Commerce) — BSEB — 2022"></textarea>
            </div>
            <div class="field">
              <label class="field__label">Skills (comma se alag karein)</label>
              <input class="input-ssz" data-r="skills" type="text" placeholder="MS Office, Tally Prime, GST Filing, Hindi Typing">
            </div>
            <div class="field">
              <label class="field__label">Experience (har line me ek)</label>
              <textarea class="textarea-ssz" data-r="experience" style="min-height:90px" placeholder="Accounts Assistant — Sharma Traders, Ara — 2024-2026&#10;Data Entry Operator — CSC Centre — 2023"></textarea>
            </div>
            <div class="adm-row">
              <div class="field">
                <label class="field__label">Certificates / Courses</label>
                <textarea class="textarea-ssz" data-r="certificates" style="min-height:70px" placeholder="AI Powered DCA — Soft Skill Zone"></textarea>
              </div>
              <div class="field">
                <label class="field__label">Languages</label>
                <input class="input-ssz" data-r="languages" type="text" placeholder="Hindi, English, Bhojpuri">
              </div>
            </div>
            <div class="cluster" style="margin-top:.5rem">
              <button class="btn-ssz btn-primary-ssz" type="button" id="resPrint">Print / PDF</button>
              <button class="btn-ssz btn-ghost-ssz" type="button" id="resSample">Sample bharein</button>
              <button class="btn-ssz btn-ghost-ssz" type="button" id="resClear">Clear</button>
            </div>
            <p class="field__hint" style="margin-top:.75rem">Aapka data sirf is browser me save hota hai — kahin bheja nahi jaata.</p>
          </div>
        </div>

        <div class="tool-panel">
          <div class="tool-panel__head">Preview</div>
          <div class="tool-panel__body" style="background:var(--bg-surface-2)">
            <div id="resSheet"></div>
          </div>
        </div>
      </div>

    </div>
  </section>
</main>

<script>
/* PWA: install the service worker so the site opens fast and the free
   tools keep working on weak mobile data. Fails silently on file://. */

  window.addEventListener("load", function () {
    navigator.serviceWorker.register("../../sw.js").catch(function () {});
  });
}
</script>
