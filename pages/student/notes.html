<!DOCTYPE html>
<html lang="en" class="no-js" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Notes | Soft Skill Zone Student</title>
<meta name="robots" content="noindex">
<script>
(function(){var t=null;try{t=localStorage.getItem("ssz.theme");}catch(e){}
if(t!=="light"&&t!=="dark"){t=window.matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";}
document.documentElement.setAttribute("data-theme",t);
document.documentElement.style.colorScheme=t;})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

</head>

<body data-depth="2">

<div class="dash" id="dash">
  <aside class="dash-side" id="dashSide"></aside>
  <div class="dash-main">
    <header class="dash-top" id="dashTop"></header>
    <main class="dash-body" id="dashBody">

      <div class="toolbar">
        <div class="toolbar__search">
          <div class="input-group-ssz">
            <span class="input-group-ssz__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></span>
            <input class="input-ssz" id="noteSearch" type="search" placeholder="Notes dhundein…" aria-label="Notes search">
          </div>
        </div>
      </div>
      <h2 class="sr-only">Notes list</h2>
      <div id="noteList" class="auto-grid"></div>

    </main>
  </div>
</div>

<script type="module" src="../../js/dashboard/student-notes.js"></script>

</html>
