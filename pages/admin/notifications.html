<!DOCTYPE html>
<html lang="en" class="no-js" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Notifications | SSZ Admin</title>
<meta name="robots" content="noindex">
<script>
(function(){var t=null;try{t=localStorage.getItem("ssz.theme");}catch(e){}
if(t!=="light"&&t!=="dark"){t=window.matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";}
document.documentElement.setAttribute("data-theme",t);
document.documentElement.style.colorScheme=t;})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../../css/tokens.css">
<link rel="stylesheet" href="../../css/base.css">
<link rel="stylesheet" href="../../css/layout.css">
<link rel="stylesheet" href="../../css/components.css">
<link rel="stylesheet" href="../../css/animations.css">
<link rel="stylesheet" href="../../css/pages.css">
<link rel="stylesheet" href="../../css/auth.css">
<link rel="stylesheet" href="../../css/admission.css">
<link rel="stylesheet" href="../../css/dashboard.css">
<link rel="manifest" href="../../manifest.json">
<link rel="icon" href="../../images/logo/favicon.svg" type="image/svg+xml">
<link rel="icon" href="../../images/logo/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="../../images/logo/apple-touch-icon.png">
</head>

<body data-depth="2">

<div class="dash" id="dash">
  <aside class="dash-side" id="dashSide"></aside>
  <div class="dash-main">
    <header class="dash-top" id="dashTop"></header>
    <main class="dash-body" id="dashBody">

      <div class="split split-6-5" style="align-items:start">
        <section class="dash-section">
          <div class="card-ssz">
            <div class="card-ssz__head"><h2 style="margin:0;font-size:1.15rem">Nayi Notification Bhejein</h2></div>
            <div class="card-ssz__body">
              <form id="ntfForm" novalidate>
                <div class="field">
                  <label class="field__label" for="ntfAudience">Title <span class="req">*</span></label>
                  <input class="input-ssz" name="title" type="text" placeholder="Jaise: Kal ki class 6 PM par">
                  <div class="field__error"></div>
                </div>
                <div class="field">
                  <label class="field__label">Message <span class="req">*</span></label>
                  <textarea class="textarea-ssz" name="message" placeholder="Poori baat yahan likhein…"></textarea>
                  <div class="field__error"></div>
                </div>
                <div class="adm-row">
                  <div class="field">
                    <label class="field__label">Type</label>
                    <select class="select-ssz" name="type">
                      <option value="general">General</option><option value="fee">Fee</option>
                      <option value="class">Class</option><option value="exam">Exam</option>
                      <option value="holiday">Holiday</option>
                    </select>
                  </div>
                  <div class="field">
                    <label class="field__label">Priority</label>
                    <select class="select-ssz" name="priority">
                      <option value="normal">Normal</option><option value="high">High</option><option value="low">Low</option>
                    </select>
                  </div>
                </div>
                <div class="field">
                  <label class="field__label">Kisko bhejein</label>
                <select class="select-ssz" name="audience" id="ntfAudience">
                    <option value="all">Sabhi students</option>
                    <option value="batch">Ek batch ko</option>
                    <option value="student">Ek student ko</option>
                  </select>
                </div>
                <div class="field" id="ntfBatchField" hidden>
                  <label class="field__label">Batch</label>
                  <select class="select-ssz" name="batchId"></select>
                </div>
                <div class="field" id="ntfStudentField" hidden>
                  <label class="field__label">Student ID</label>
                  <input class="input-ssz" name="studentId" type="text" placeholder="SSZ2026DCA0007">
                </div>
                <button class="btn-ssz btn-primary-ssz btn-block-ssz" type="submit" id="ntfSend">Bhejein</button>
              </form>
            </div>
          </div>
        </section>
        <section class="dash-section">
          <div class="dash-section__head"><h2>Bheji gayi</h2></div>
          <div id="ntfSent" class="stack" style="gap:.75rem"></div>
        </section>
      </div>

    </main>
  </div>
</div>

<script type="module" src="../../js/dashboard/admin-notifications.js"></script>
</body>
</html>
