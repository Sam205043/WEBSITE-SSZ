<!DOCTYPE html>
<html lang="en" class="no-js" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Attendance | SSZ Admin</title>
<meta name="robots" content="noindex">
<script>
(function(){var t=null;try{t=localStorage.getItem("ssz.theme");}catch(e){}
if(t!=="light"&&t!=="dark"){t=window.matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";}
document.documentElement.setAttribute("data-theme",t);
document.documentElement.style.colorScheme=t;})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../../css/tokens.css">
<link rel="stylesheet" href="../../css/base.css">
<link rel="stylesheet" href="../../css/layout.css">
<link rel="stylesheet" href="../../css/components.css">
<link rel="stylesheet" href="../../css/animations.css">
<link rel="stylesheet" href="../../css/pages.css">
<link rel="stylesheet" href="../../css/auth.css">
<link rel="stylesheet" href="../../css/admission.css">
<link rel="stylesheet" href="../../css/dashboard.css">
<link rel="manifest" href="../../manifest.json">
<link rel="icon" href="../../images/logo/favicon.svg" type="image/svg+xml">
<link rel="icon" href="../../images/logo/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="../../images/logo/apple-touch-icon.png">
</head>

<body data-depth="2">

<div class="dash" id="dash">
  <aside class="dash-side" id="dashSide"></aside>
  <div class="dash-main">
    <header class="dash-top" id="dashTop"></header>
    <main class="dash-body" id="dashBody">

      <div class="toolbar">
        <select class="select-ssz" id="atBatch" aria-label="Batch" style="min-width:220px"></select>
        <input class="input-ssz" id="atDate" type="date" style="max-width:180px" aria-label="Date">
        <span style="flex:1"></span>
        <button class="btn-ssz btn-secondary-ssz btn-sm-ssz" type="button" id="atAllPresent">Sabko Present karein</button>
        <button class="btn-ssz btn-primary-ssz" type="button" id="atSave">Save Karein</button>
      </div>
      <p class="text-muted-c" id="atMeta" style="font-size:.85rem;margin-bottom:1rem"></p>
      <div class="table-wrap">
        <table class="table-ssz">
          <thead><tr><th>Roll</th><th>Student</th><th>Status</th></tr></thead>
          <tbody id="atRows"></tbody>
        </table>
      </div>

    </main>
  </div>
</div>

<script type="module" src="../../js/dashboard/admin-attendance.js"></script>
</body>
</html>
