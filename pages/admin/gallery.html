<!DOCTYPE html>
<html lang="en" class="no-js" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Gallery | SSZ Admin</title>
<meta name="robots" content="noindex">
<script>
(function(){var t=null;try{t=localStorage.getItem("ssz.theme");}catch(e){}
if(t!=="light"&&t!=="dark"){t=window.matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";}
document.documentElement.setAttribute("data-theme",t);
document.documentElement.style.colorScheme=t;})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../../css/tokens.css">
<link rel="stylesheet" href="../../css/base.css">
<link rel="stylesheet" href="../../css/layout.css">
<link rel="stylesheet" href="../../css/components.css">
<link rel="stylesheet" href="../../css/animations.css">
<link rel="stylesheet" href="../../css/pages.css">
<link rel="stylesheet" href="../../css/auth.css">
<link rel="stylesheet" href="../../css/dashboard.css">
<link rel="manifest" href="../../manifest.json">
<link rel="icon" href="../../images/logo/favicon.svg" type="image/svg+xml">
<link rel="icon" href="../../images/logo/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="../../images/logo/apple-touch-icon.png">
</head>

<body data-depth="2">

<div class="dash" id="dash">
  <aside class="dash-side" id="dashSide"></aside>
  <div class="dash-main">
    <header class="dash-top" id="dashTop"></header>
    <main class="dash-body" id="dashBody">

      <!-- Upload box: category pehle chunni hoti hai kyunki ek baar me kai
           photos chadhti hain aur sab par wahi category lagti hai. Caption
           baad me har photo par alag se lag jaata hai. -->
      <section class="dash-section" style="margin-bottom:2rem">
        <div class="dash-section__head"><h2>Nayi photos chadhayein</h2></div>

        <p style="font-size:.85rem;color:var(--text-muted);margin:0 0 1rem;max-width:64ch">
          Ek saath kai photos chun sakte hain. Photo browser me hi chhoti ho jaati hai,
          isliye phone ki badi photo bhi chal jaati hai aur website jaldi khulti hai.
          Chadhte hi ye website ke Gallery page par dikhne lagengi.
        </p>

        <div style="display:flex;gap:.75rem;flex-wrap:wrap;align-items:flex-end">
          <div class="field" style="margin:0;min-width:190px">
            <label class="field__label" for="galCat">Category</label>
            <select class="input-ssz" id="galCat"></select>
          </div>
          <div class="field" style="margin:0;flex:1;min-width:230px">
            <label class="field__label" for="galPick">Photos</label>
            <input class="input-ssz" type="file" id="galPick" accept="image/jpeg,image/png,image/webp"
                   multiple style="padding:.6rem">
          </div>
        </div>

        <div class="progress-ssz" hidden id="galProg" style="margin-top:1rem">
          <div class="progress-ssz__bar"></div>
        </div>
        <p id="galProgText" style="font-size:.8rem;color:var(--text-muted);margin:.45rem 0 0"></p>
      </section>

      <div class="dash-section__head"><h2>Chadhi hui photos</h2></div>
      <div class="filter-row" id="galFilters" style="justify-content:flex-start;margin-bottom:1.25rem"></div>
      <div id="galGrid" class="auto-grid"
           style="grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr))"></div>

    </main>
  </div>
</div>

<script type="module" src="../../js/dashboard/admin-gallery.js"></script>
</body>
</html>
