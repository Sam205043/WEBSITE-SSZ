<script type="application/ld+json" id="ssz-static-ld">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "BreadcrumbList",
      "itemListElement": [
        {
          "@type": "ListItem",
          "position": 1,
          "name": "Home",
          "item": "https://softskillzone.in/index.html"
        },
        {
          "@type": "ListItem",
          "position": 2,
          "name": "FAQ",
          "item": "https://softskillzone.in/pages/faq.html"
        }
      ]
    },
    {
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Admission ke liye kya documents chahiye?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Aadhaar card, last qualification ki marksheet aur 2 passport size photo. Online admission form me aap inhe scan/photo karke upload kar sakte hain."
          }
        },
        {
          "@type": "Question",
          "name": "Kya main online admission le sakta hoon?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Bilkul. Website par 'Online Admission' page se form bharein, photo aur documents upload karein — application turant institute ko mil jaayegi aur aapko Student ID SMS/WhatsApp par bhej di jaayegi."
          }
        },
        {
          "@type": "Question",
          "name": "Kya fees installment me de sakte hain?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Haan. Zyadatar courses me monthly ya quarterly installment ka option hai. Aapka pending amount aur due date student dashboard me hamesha dikhta rahega."
          }
        },
        {
          "@type": "Question",
          "name": "Fees online kaise jama karein?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Student dashboard me 'Pay Now' button se Razorpay payment link khulta hai. Payment ke baad screenshot upload karein — admin verify karke receipt generate kar dega."
          }
        },
        {
          "@type": "Question",
          "name": "Live classes kaise join karein?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Student dashboard ke 'Live Classes' section me scheduled class dikhegi. Class time par 'Join Live Class' button dabate hi Google Meet apne aap khul jaayega."
          }
        },
        {
          "@type": "Question",
          "name": "Agar class miss ho jaye to?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Notes aur recording (jahan available ho) dashboard ke Notes section me milti hai. Doubt ke liye aap faculty se WhatsApp par sampark kar sakte hain."
          }
        },
        {
          "@type": "Question",
          "name": "Certificate kab milta hai?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Course complete karne aur final assessment pass karne ke baad certificate issue hota hai. Aap ise dashboard se download kar sakte hain, aur koi bhi ise website par verify kar sakta hai."
          }
        },
        {
          "@type": "Question",
          "name": "Kya computer ka koi purv anubhav chahiye?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Beginner courses (DCA, ADCA, Tally) ke liye bilkul nahi. Hum zero se shuru karte hain."
          }
        }
      ]
    }
  ]
}
</script>
