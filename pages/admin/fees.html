<!DOCTYPE html>
<html lang="en" translate="no" class="no-js" data-theme="light">
<head>
<meta charset="UTF-8">
<!-- `interactive-widget=resizes-content` ke bina Chrome keyboard khulne par
     page ko chhota nahi karta — 100dvh utna hi rehta hai. Iska matlab tha ki
     modal ka neeche wala button (jaise "Collect + Receipt") keyboard ke
     PEECHHE chala jaata tha, aur `lockScroll` ki wajah se page scroll bhi
     nahi hota tha. Har baar keyboard band karke button dabana padta tha. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#ffffff">
<title>Fee Management | SSZ Admin</title>
<meta name="robots" content="noindex">
<script>
(function(){var t=null;try{t=localStorage.getItem("ssz.theme");}catch(e){}
if(t!=="light"&&t!=="dark"){t=window.matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";}
document.documentElement.setAttribute("data-theme",t);
document.documentElement.style.colorScheme=t;})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Font ab render rokte nahi.

     Pehle ye ek saada stylesheet link tha, aur wo bhi kisi doosre server
     (Google) ka — yaani pehla akshar dikhne se PEHLE browser ko Google se
     jawab ka intezaar karna padta tha. Ara ki patli 3G par yahi ek line
     poore page ko do-teen second rok deti thi.

     `media="print"` browser ko batata hai "abhi iski zaroorat nahi", isliye
     wo download to karta hai par rukta nahi; utarte hi `onload` use `all`
     kar deta hai aur font lag jaata hai. `preload` pehle se line me laga
     deta hai taaki der bhi na ho. JavaScript band ho to <noscript> wala
     purana tareeka chal jaata hai.

     Weight bhi 8 se 6 kar diye: Manrope 800 aur Poppins 600 poore project
     me kahin istemaal hi nahi ho rahe the (jaanch kar hataye hain). -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Poppins:wght@700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Poppins:wght@700;800&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Poppins:wght@700;800&display=swap"></noscript>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../../css/tokens.css">
<link rel="stylesheet" href="../../css/base.css">
<link rel="stylesheet" href="../../css/layout.css">
<link rel="stylesheet" href="../../css/components.css">
<link rel="stylesheet" href="../../css/animations.css">
<link rel="stylesheet" href="../../css/pages.css">
<link rel="stylesheet" href="../../css/auth.css">
<link rel="stylesheet" href="../../css/admission.css">
<link rel="stylesheet" href="../../css/dashboard.css">
<link rel="manifest" href="../../manifest.json">
<link rel="icon" href="../../images/logo/favicon.svg" type="image/svg+xml">
<link rel="icon" href="../../images/logo/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="../../images/logo/apple-touch-icon.png">
</head>

<body data-depth="2">

<div class="dash" id="dash">
  <aside class="dash-side" id="dashSide"></aside>
  <div class="dash-main">
    <header class="dash-top" id="dashTop"></header>
    <main class="dash-body" id="dashBody">

      <div id="feeTiles" class="auto-grid" style="grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));margin-bottom:2rem"></div>

      <!-- Razorpay se paisa aa gaya par kis student ka hai, ye system nahi
           jaan paaya (aksar tab jab link Razorpay dashboard se haath se
           banaya gaya ho). Sabse upar isliye hai ki ye asli paisa hai jo
           abhi kisi ke khaate me chadha hi nahi. -->
      <section class="dash-section" id="unmatchedSection" hidden>
        <div class="dash-section__head">
          <h2>Bina jude payment</h2>
        </div>
        <p class="dash-section__note" style="font-size:.82rem;color:var(--text-muted);margin:-.25rem 0 .9rem">
          Ye paise Razorpay me aa chuke hain, par kisi student ke khaate me nahi chadhe.
          Sahi student chunkar jodein — tabhi receipt banegi aur bakaya kam hoga.
        </p>
        <div id="unmatchedList" class="stack" style="gap:.75rem"></div>
      </section>

      <section class="dash-section" id="verifySection" hidden>
        <div class="dash-section__head"><h2>Verify karne wale payments</h2></div>
        <div id="verifyList" class="stack" style="gap:.75rem"></div>
      </section>
      <section class="dash-section" id="dueSection" hidden>
        <div class="dash-section__head">
          <h2>Bakaya — reminder bhejein</h2>
          <button class="btn-ssz btn-secondary-ssz btn-sm-ssz" type="button" id="dueNotifyAll">
            Sabko dashboard par yaad dilayein
          </button>
        </div>
        <div id="dueList" class="stack" style="gap:.75rem"></div>
      </section>
      <section class="dash-section">
        <div class="dash-section__head">
          <h2>Collections</h2>
          <div class="cluster">
            <!-- Sirf admin ke login se ₹1 ka link banta hai. Ye asli payment
                 ka poora raasta jaanchne ke liye hai (paisa -> webhook ->
                 receipt), taaki uske liye ₹700 na lagane pade. Student ke
                 liye hadd hamesha 10% / ₹100 hi rehti hai. -->
            <button class="btn-ssz btn-ghost-ssz btn-sm-ssz" type="button" id="feeTestLink">₹1 Test Link</button>
            <button class="btn-ssz btn-secondary-ssz btn-sm-ssz" type="button" id="feeExport">Excel Export</button>
            <button class="btn-ssz btn-primary-ssz btn-sm-ssz" type="button" id="feeCollect">+ Fee Collect Karein</button>
          </div>
        </div>
        <div class="toolbar">
          <div class="toolbar__search">
            <div class="input-group-ssz">
              <span class="input-group-ssz__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></span>
              <input class="input-ssz" id="feeSearch" type="search" placeholder="Student naam ya ID se dhundein…" aria-label="Search">
            </div>
          </div>
        </div>
        <div class="table-wrap">
          <table class="table-ssz">
            <thead><tr><th>Receipt</th><th>Student</th><th>Date</th><th>Mode</th><th class="num">Amount</th><th><span class="sr-only">Actions</span></th></tr></thead>
            <tbody id="feeRows"></tbody>
          </table>
        </div>
      </section>

    </main>
  </div>
</div>

<script type="module" src="../../js/dashboard/admin-fees.js"></script>
</body>
</html>
